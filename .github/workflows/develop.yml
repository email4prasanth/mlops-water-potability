  # -----------------------------
  # 2) Terraform: destroy
  # -----------------------------
  terraform-destroy:
    needs: changes
    if: ${{ needs.changes.outputs.water-potability == 'true' || needs.changes.outputs.IOC == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IOC

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete all images in ECR repository
        run: |
          REPO_NAME="mlops-water-potability"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ env.AWS_REGION }}"
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO_NAME}"
  
          echo "Deleting all images from $ECR_URI ..."
          aws ecr list-images --repository-name $REPO_NAME --query 'imageIds[*]' --output json | \
            jq -c '.[]' | \
            while read image; do
              aws ecr batch-delete-image --repository-name $REPO_NAME --image-ids "$image"
            done
          echo "All images deleted from $ECR_URI."

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Select/Create Workspace
        run: terraform workspace select $ENVIRONMENT || terraform workspace new $ENVIRONMENT

      - name: Terraform Refresh
        run: terraform refresh

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan for Destroy
        run: terraform plan -destroy -out=tfplan_destroy

      - name: Terraform Destroy
        run: terraform apply -auto-approve tfplan_destroy

