name: MLOps CI/CD Pipeline

on:
  push:
    branches: 
      - dev

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mlops-water-potability
  DOCKER_IMAGE: water-potability-app
  AWS_EC2_USER: ubuntu
  AWS_EC2_IP: 34.205.252.37

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      water-potability: ${{ steps.filter.outputs.water-potability }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            water-potability:
              - 'water-potability/**'

  water-potability:
    needs: changes
    if: ${{ needs.changes.outputs.water-potability == 'true' }}
    name: Build and Deploy Water Potability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify files
        run: |
          ls -la
          ls -la water-potability/
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          cd water-potability
          pip install -r requirements.txt
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Set Up Tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      
      - name: Build Docker image
        run: |
          cd water-potability
          docker build \
            --build-arg PYTHON_VERSION=3.12 \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REPOSITORY }}:latest \
            -f Dockerfile .
      
      - name: Tag and push Docker image
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    needs: water-potability
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.AWS_EC2_IP }}
          username: ${{ env.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            # Install AWS CLI if not present
            if ! command -v aws &> /dev/null; then
              echo "Installing AWS CLI..."
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip awscliv2.zip
              sudo ./aws/install
              rm -rf awscliv2.zip aws
            fi
            
            # Clean up existing directory if it exists
            if [ -d "/home/ubuntu/mlops-water-potability" ]; then
              echo "Removing existing directory..."
              rm -rf /home/ubuntu/mlops-water-potability
            fi
            
            # Clone the repository
            git clone https://github.com/email4prasanth/mlops-water-potability.git /home/ubuntu/mlops-water-potability
            cd /home/ubuntu/mlops-water-potability
            git checkout dev

            # Configure AWS credentials
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws configure set region ${{ env.AWS_REGION }}

            # Get the latest image tag
            IMAGE_TAG=$(git rev-parse --short HEAD)
            ECR_REGISTRY=$(aws sts get-caller-identity --query 'Account' --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
            
            # Stop and remove old container if running
            if docker ps -a | grep ${{ env.DOCKER_IMAGE }}; then
              docker stop ${{ env.DOCKER_IMAGE }}
              docker rm ${{ env.DOCKER_IMAGE }}
            fi
            
            # Login to ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
            
            # Pull the latest image
            docker pull $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
            
            # Run the new container
            docker run -d \
              --name ${{ env.DOCKER_IMAGE }} \
              -p 8000:8000 \
              --restart unless-stopped \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_REGION=${{ env.AWS_REGION }} \
              $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
            
            # Verify the container is running
            echo "Current running containers:"
            docker ps
            echo "Deployment completed successfully!"